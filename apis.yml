aid: santander-uk
url: https://raw.githubusercontent.com/api-evangelist/santander-uk/refs/heads/main/apis.yml
name: Santander UK
kind: company
description: Santander UK plc is a major British retail and commercial bank and one
  of the CMA9 banks mandated to deliver UK Open Banking. It is a wholly owned,
  ring-fenced subsidiary of Banco Santander S.A. of Madrid, Spain, and was formed
  from the former Abbey National, Alliance & Leicester, and the savings business of
  Bradford & Bingley. Operating from Milton Keynes with a registered office in
  London, it serves around 14 million active personal, business, and corporate
  customers. Santander UK is authorised by the Prudential Regulation Authority and
  regulated by the Financial Conduct Authority and the PRA. Under PSD2 and the CMA
  Order it publishes a developer portal ("Santander Developers") exposing free,
  unauthenticated Open Data APIs (ATMs, branches, and product reference data) plus
  the OBIE Read/Write API family - Account & Transaction Information (AIS), Payment
  Initiation (PIS), and Confirmation of Funds (CBPII) - conformant to the Open
  Banking Implementation Entity standard and secured with FAPI-grade OAuth2/OIDC,
  mutual-TLS client authentication, and PSD2 strong customer authentication.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
